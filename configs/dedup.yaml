input: data/${DATASET}_clean_pipeline.jsonl # output of `peratrasher --config configs/pipeline.yaml`
output: data/${DATASET}_clean_pipeline_dedup.jsonl
stats_dir: stats/
stats_prefix: ${DATASET}_be

# Dedup on the Belarusian side. HPLT rows carry `src` / `tgt` (tmx-prep schema),
# unlike bouquet's `src_text` — text_field set accordingly. Writes
# `metrics.dedup_keeper` (one True per near-dup cluster); the filter's
# `not_a_duplicate` rule reads it.
text_field: ${SRC_FIELD}

minhash:
  threshold: 0.8 # Jaccard threshold above which rows cluster.
  ngram_size: 5 # token n-gram size for shingling.
  num_perm: 128 # MinHash permutation count.
  min_length:
    5 # below this token count text-dedup filters the row out;
    # filtered rows become singletons (their own cluster).
  num_proc: 1 # text-dedup multiprocessing degree.
