input: data/${DATASET}_survived.jsonl
output: data/${DATASET}_train.parquet
stats_dir: stats/
stats_prefix: ${DATASET}_be

# Parquet is the HF-native format: load with
#   load_dataset("parquet", data_files="data/bouquet_train.parquet")
# Switch `format` to `jsonl` for a JSON-Lines file
# (also HF-readable via load_dataset("json", ...), bigger on disk).
format: parquet
compression: zstd # parquet only; 'zstd' | 'snappy' | 'gzip' | 'none'

# Flat output columns. Wikimedia schema: src, tgt, src_lang, tgt_lang.
columns:
  - ${SRC_FIELD}
  - ${TGT_FIELD}
