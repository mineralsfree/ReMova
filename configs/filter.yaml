input: data/${DATASET}_clean_pipeline_dedup.jsonl # output of `peratrasher-dedup --config configs/dedup.yaml`
survived: data/${DATASET}_survived.jsonl
rejected: data/${DATASET}_rejected.jsonl
stats_dir: stats/
stats_prefix: ${DATASET}_be

# Goal: narkamaŭka-only training corpus (no Tarashkievica). Belarusian LT
# dictionary is narkamaŭka-only, so when it flags a word as a misspelling
# it's either (a) a proper noun / loan word it doesn't know, or (b) a
# Tarashkievica form. The pipeline now discounts (a) two ways —
# `exclude_proper_nouns: true` in pipeline_hplt.yaml + the curated
# be/hunspell/ignore.txt baked into the LT jar — so a residual misspelling
# here is overwhelmingly "Tarashkievica deviation + real typo".
#
# NB: re-run pipeline_hplt.yaml with the updated LT jar before filtering, else
# ~7.5% of misspelling flags are still the known false positives. Survival at
# these thresholds ≈ 76% pre-dedup (mis==0 is the binding rule); see analysis.
filters:
  - name: no_objections
    type: no_removal_reasons
    # wrong_lang on either side + length_ratio violations.

  - name: no_lt_errors
    type: max_metric
    key: metrics.src_langtool.count
    value: 0
    # Drop any row with ≥1 LT match of any type (misspelling / grammar /
    # style / whitespace / etc.). `count` is post-proper-noun exclusion.

  - name: no_russian_и
    type: not_contains
    key: ${SRC_FIELD}
    substring: и
    # Narkamaŭka uses `і`, never `и`. Any row with `и` on the BE side is
    # Russian intrusion or OCR noise.

  - name: not_a_duplicate
    type: require_true
    key: metrics.dedup_keeper
