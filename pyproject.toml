[project]
name = "peratrasher"
version = "0.0.1"
description = "Data-cleaning pipeline for AI training data (JSONL)."
requires-python = ">=3.11"
dependencies = [
    "fasttext-numpy2>=0.10.4",
    "ftfy>=6.0",
    "pyyaml>=6.0",
]

[project.scripts]
peratrasher = "peratrasher.cli:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peratrasher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
